<body class="min-h-screen flex flex-col">

    function openFeedDatabase() {

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(FEED_DB_STORE)) db.createObjectStore(FEED_DB_STORE);

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Could not open feed database'));
        request.onblocked = () => reject(new Error('Feed database upgrade is blocked by another app tab'));
      });
    }

    async function saveFeedToIndexedDB(payload) {

      try {

          const tx = db.transaction(FEED_DB_STORE, 'readwrite');
          tx.objectStore(FEED_DB_STORE).put(payload, 'latest');
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error || new Error('Could not save complete feed to IndexedDB'));
          tx.onabort = () => reject(tx.error || new Error('Feed cache write was aborted'));
        });
      } finally { db.close(); }
    }

          const tx = db.transaction(FEED_DB_STORE, 'readonly');
          const request = tx.objectStore(FEED_DB_STORE).get('latest');
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error || new Error('Could not read offline feed'));

    async function fetchLiveDeals(userInitiated = false) {

          verified: nextVerified,

            const st = hit && hit.stores.find(x => x.store === it.store);

    function getCheapestOption(product) {
      return product.stores.slice().sort((a, b) => effectivePrice(a) - effectivePrice(b))[0];

    function getMaxSpread(product) {
      if (!product.stores || product.stores.length < 2) {

        return st ? Math.max(0, st.price - effectivePrice(st)) : 0;

      return Math.max(...prices) - Math.min(...prices);

    // South African promotions use SAST (UTC+02:00) year-round. Convert a
    // date-only boundary to the corresponding UTC instant so device timezone
    // settings cannot shift the advertised start/end day.
    function sastCalendarBoundary(value, dayOffset = 0) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || '').slice(0, 10));
      if (!match) return NaN;
      const y = Number(match[1]), m = Number(match[2]), d = Number(match[3]);
      const utc = Date.UTC(y, m - 1, d);
      const check = new Date(utc);
      if (check.getUTCFullYear() !== y || check.getUTCMonth() !== m - 1 || check.getUTCDate() !== d) return NaN;
      return utc + Number(dayOffset || 0) * 86400000 - 2 * 60 * 60 * 1000;
    }

    function getExpiryInfo(validUntil, validFrom, validUntilAt, validFromAt) {

        return instant.toLocaleDateString('en-ZA', { timeZone: 'Africa/Johannesburg', weekday: 'short', day: 'numeric', month: 'short' });
      };
      const now = new Date();
      const sastDate = new Date(now.getTime() + 2 * 60 * 60 * 1000);
      const pad2 = n => String(n).padStart(2, '0');
      const todaySast = sastDate.getUTCFullYear() + '-' + pad2(sastDate.getUTCMonth() + 1) + '-' + pad2(sastDate.getUTCDate());
      const todayBoundary = sastCalendarBoundary(todaySast);

        if (!Number.isNaN(fromInstant.getTime()) && fromInstant > now) {

        }
      } else if (validDate(validFrom) && sastCalendarBoundary(validFrom) > todayBoundary) {

      }
      if (validUntilAt) {
        const expiry = new Date(validUntilAt);
        if (!Number.isNaN(expiry.getTime())) {
          const ms = expiry.getTime() - now.getTime();
          if (ms <= 0) return { expired: true, label: 'Expired ' + expiry.toLocaleString('en-ZA', { timeZone: 'Africa/Johannesburg', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }), urgent: false };
          if (ms <= 24 * 60 * 60 * 1000) {
            const hours = Math.floor(ms / 3600000);

          }
          return { expired: false, label: 'Ends ' + expiry.toLocaleString('en-ZA', { timeZone: 'Africa/Johannesburg', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }), urgent: false };
        }

      if (diff === 0) return { expired: false, label: '⏰ Ends today · exact time not stated', urgent: true };

      return { expired: false, label: 'Ends ' + fmt(validUntil), urgent: false };

        && (x.card || null) === (it.card || null)) || st;

        validUntil: selected.validUntil || ((!selected.validUntilAt) ? (st.validUntil || p.validUntil) : ''),

        validUntilAt: selected.validUntilAt || ((!selected.validUntil) ? (st.validUntilAt || p.validUntilAt) : ''),

          // not hide a still-valid alternate offer for the same store.
          const candidates = [st, ...(Array.isArray(st.moreOffers) ? st.moreOffers : [])].map(raw => {
            const offer = {
              ...st, ...raw, store: st.store,
              validUntil: raw.validUntil || ((!raw.validUntilAt) ? (st.validUntil || p.validUntil) : ''),
              validFrom: raw.validFrom || ((!raw.validFromAt) ? (st.validFrom || p.validFrom) : ''),
              validUntilAt: raw.validUntilAt || ((!raw.validUntil) ? (st.validUntilAt || p.validUntilAt) : ''),
              validFromAt: raw.validFromAt || ((!raw.validFrom) ? (st.validFromAt || p.validFromAt) : ''),

    function storeMetaHtml(st, p) {

        return `<span class="block text-[10px] ${color}">＋ also ${zar(m.rewardPrice || m.price)}${m.card ? ' · ' + escapeHtml(String(m.card).toUpperCase()) : ''}${m.multiBuy ? ' · ' + escapeHtml(m.multiBuy) : ''}${m.pamphletTitle ? ' · ' + escapeHtml(m.pamphletTitle) : ''}${Array.isArray(m.provinces) && !m.provinces.includes('All') ? ' · ' + escapeHtml(m.provinces.join(', ')) : ''}${mi.label ? ' · ' + escapeHtml(mi.label) : ''}${provenance ? ' · ' + escapeHtml(provenance) : ''}${m.sourceUrl ? ' · <a class="underline" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(m.sourceUrl) + '">source</a>' : ''}</span>`;
      }).join('');
      const c = i.expired ? 'text-rose-700' : i.upcoming ? 'text-indigo-700' : i.urgent ? 'text-amber-700' : 'text-slate-500';
      const provenance = [st.sourceLabel || st.sourceId, st.sourceFile, st.sourcePage ? `page ${st.sourcePage}` : ''].filter(Boolean).join(' · ');
      const sourceLink = st.sourceUrl ? `<a class="underline text-slate-500" href="${escapeHtml(st.sourceUrl)}" target="_blank" rel="noopener noreferrer">source</a>` : '';
      return `<span class="block text-[10px] leading-tight ${c} font-semibold">${escapeHtml(i.label)}${st.multiBuy ? ' · <span class="text-violet-700">' + escapeHtml(st.multiBuy) + '</span>' : ''}${perUnit(p, effectivePrice(st))}</span>`
        + (st.pamphletTitle ? `<span class="block text-[10px] text-slate-400 truncate">${escapeHtml(st.pamphletTitle)}</span>` : '')
        + (provenance || sourceLink ? `<span class="block text-[10px] text-slate-400">${escapeHtml(provenance)}${provenance && sourceLink ? ' · ' : ''}${sourceLink}</span>` : '') + more;
    }

    function detectProvinceByGPS() {
      if (!navigator.geolocation && !(window.MzansiNative && typeof window.MzansiNative.getCurrentPosition === 'function')) {
        showToast('GPS not supported on this device — choose your province manually.');
        return;
      }
      showToast('Detecting your SA province...');
      const options = { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 };
      const positionRequest = window.MzansiNative && typeof window.MzansiNative.getCurrentPosition === 'function'
        ? window.MzansiNative.getCurrentPosition(options)
        : new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, options));
      positionRequest.then(pos => {
        const { latitude, longitude } = pos.coords;
        let nearest = SA_PROVINCE_COORDS[0];
        let minD = Infinity;
        SA_PROVINCE_COORDS.forEach(pr => {
          const d = Math.hypot(latitude - pr.lat, longitude - pr.lon);
          if (d < minD) { minD = d; nearest = pr; }
        });
        state.province = nearest.name;
        saveState();
        updateHeader();
        renderFooter();
        renderCurrentTab();
        showToast(`Province detected: ${nearest.name}. Your coordinates are not saved by this app.`);
      }).catch(() => showToast('Location permission denied or unavailable — choose your province manually.'));
    }

    function computeBasket() {
      let regularTotal = 0;
      let finalTotal = 0;
      let totalQty = 0;
      state.basket.forEach(item => {
        const qty = Number(item.qty) || 1;
        totalQty += qty;
        regularTotal += (Number(item.price) || 0) * qty;
        const unit = (item.card && state.activeCards[item.card]) ? (Number(item.rewardPrice) || Number(item.price)) : (Number(item.price) || 0);
        finalTotal += unit * qty;
      });
      const rewardsSaved = Math.max(0, regularTotal - finalTotal);
      const hasBudget = state.budgetLimit !== null && state.budgetLimit !== '' && Number(state.budgetLimit) > 0;
      const remaining = hasBudget ? (Number(state.budgetLimit) - finalTotal) : null;
      return { regularTotal, finalTotal, rewardsSaved, remaining, hasBudget, totalQty };
    }

    function getBasketEntry(productId, storeName) {
      return state.basket.find(x => x.productId === productId && (!storeName || x.store === storeName));
    }

    function updateHeader() {
      const b = computeBasket();
      document.getElementById('hdr-basket-total').textContent = zar(b.finalTotal);
      document.getElementById('province-select').value = state.province;
      const bnavLabel = document.getElementById('bnav-basket-label');
      if (bnavLabel) bnavLabel.textContent = `Basket (${b.totalQty})`;

    function addToBasket(product, storeOpt) {
      const existing = state.basket.find(x => x.productId === product.id && x.store === storeOpt.store);
      if (existing) {
        existing.qty++;
      } else {
        state.basket.push({
          id: 'b_' + Date.now() + Math.random().toString(16).slice(2, 5),
          productId: product.id,
          name: product.name,
          store: storeOpt.store,
          price: storeOpt.price,
          rewardPrice: storeOpt.rewardPrice,
          card: storeOpt.card,
          qty: 1,
          checked: false
        });
      }
      saveState();
      updateHeader();
      showToast(`Added ${product.name} (${storeOpt.store})`);
    }

    function decrementOrRemoveProduct(productId, storeName) {
      const idx = state.basket.findIndex(x => x.productId === productId && (!storeName || x.store === storeName));
      if (idx === -1) return;
      if (state.basket[idx].qty > 1) state.basket[idx].qty--;
      else state.basket.splice(idx, 1);
      saveState();
      updateHeader();
    }

    function toggleQuickPickProduct(product) {
      const existingIdx = state.basket.findIndex(x => x.productId === product.id);
      if (existingIdx !== -1) {
        state.basket.splice(existingIdx, 1);
        saveState();
        updateHeader();
        showToast(`Removed ${product.name}`);
      } else {
        addToBasket(product, getCheapestOption(product));
      }
    }

    function renderFeedHealth() {
      const msgs = [];
      if (feedMeta.status === 'sample') msgs.push('DEMO ONLY — The built-in 75-item catalogue contains example prices and dates. They are not confirmed current retailer offers. Do not use these amounts to make a shopping decision or publish them as live deals.');
      else if (!feedMeta.verified) msgs.push('NOT HUMAN-REVIEWED — This feed was loaded, but the app cannot confirm that every product, price, region, loyalty condition and validity date matches the original retailer promotion. Check the source and shelf price before relying on it.');
      if (feedMeta.updatedAt) {
        const age = (Date.now() - new Date(feedMeta.updatedAt).getTime()) / 86400000;
        if (Number.isFinite(age) && age > 3) msgs.push(`This feed is ${Math.floor(age)} days old. Promotions may have changed; confirm the price with the retailer.`);
      }
      const hidden = REMOTE_CATALOG.reduce((n, p) => n + (p.stores || []).filter(st => getExpiryInfo(st.validUntil || p.validUntil, st.validFrom || p.validFrom, st.validUntilAt || p.validUntilAt, st.validFromAt || p.validFromAt).expired).length, 0);
      if (hidden && !state.showExpired) msgs.push(`${hidden} expired store offer${hidden === 1 ? ' is' : 's are'} hidden. Use “Show expired” to see them.`);
      return msgs.length ? `<div class="space-y-1 pt-2">${msgs.map(m => `<div class="text-[11px] font-bold text-amber-900 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-1.5">${escapeHtml(m)}</div>`).join('')}</div>` : '';
    }

    function renderStoreCounts() {
      const m = {};
      getAllCatalog().forEach(p => p.stores.forEach(st => {
        const e = m[st.store] || (m[st.store] = { n: 0, pam: {} });
        e.n++;
        const t = st.pamphletTitle || p.pamphletTitle || 'Pamphlet';
        const x = e.pam[t] || (e.pam[t] = { n: 0, until: '' });
        x.n++;
        const u = st.validUntil || p.validUntil || '';
        if (u > x.until) x.until = u;
      }));
      const rows = Object.entries(m).sort((a, b) => b[1].n - a[1].n);
      if (!rows.length) return '';
      return `<details class="pt-2 border-t border-slate-100"><summary class="text-[11px] font-bold text-slate-600 cursor-pointer">📋 Coverage: ${rows.length} stores · ${rows.reduce((a, r) => a + r[1].n, 0)} store offers (tap to verify sources)</summary>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">${rows.map(([store, e]) => `<div class="rounded-xl border border-slate-200 bg-slate-50 p-2.5">
          <div class="flex justify-between text-xs font-extrabold text-slate-900"><span>${escapeHtml(store)}</span><span class="text-emerald-700">${e.n} items</span></div>

        </div>`).join('')}</div></details>`;
    }

              : ub < ua ? `Option B wins (${zar(ub)}/unit vs ${zar(ua)}/unit — ${Math.round((1 - ub/ua)*100)}% cheaper!)`

            if (d.cardNumbers && typeof d.cardNumbers === 'object') state.cardNumbers = { ...state.cardNumbers, ...d.cardNumbers };
            if (Array.isArray(d.shopHistory)) state.shopHistory = d.shopHistory;
            if (Array.isArray(d.customCatalog)) state.customCatalog = d.customCatalog;
            if (d.province) state.province = d.province;
            if (Array.isArray(d.basket)) state.basket = d.basket.filter(x => x && x.name && Number(x.price) > 0);
            if (d.budgetLimit !== undefined) state.budgetLimit = d.budgetLimit;
            if (d.activeCards && typeof d.activeCards === 'object') state.activeCards = { ...state.activeCards, ...d.activeCards };
            if (Number.isFinite(Number(d.transportCost))) state.transportCost = Number(d.transportCost);
            if (d.lang) state.lang = d.lang;
            if (typeof d.largeText === 'boolean') { state.largeText = d.largeText; document.body.classList.toggle('large-text', d.largeText); }

    const SEARCH_SYN = { mielie: 'maize', mealie: 'maize', wors: 'boerewors', russians: 'russian', nappies: 'nappy', cooldrink: 'cold drink', airfryer: 'air fryer', hoover: 'vacuum', tv: 'television', fridge: 'refrigerator', chips: 'crisps', bbq: 'braai', cellphone: 'phone' };
    const SEARCH_STOP = new Set(['the', 'and', 'for', 'add', 'cheapest', 'cheap', 'best', 'find', 'show', 'get', 'buy', 'some', 'with', 'please', 'any', 'me', 'a']);
    function matchesSearch(p, q) {
      const unitFix = t => String(t).toLowerCase().replace(/(\d)\s*(litres?|liters?|ltrs?)\b/g, '$1l');
      const hay = unitFix(p.name + ' ' + (p.brand || '') + ' ' + p.category + ' ' + (p.pamphletTitle || '') + ' ' + p.stores.map(x => x.store + ' ' + (x.pamphletTitle || '')).join(' '));
      const words = unitFix(q).split(/\s+/).filter(w => w && !SEARCH_STOP.has(w));
      return words.every(w => hay.includes(w) || hay.includes(w.replace(/(\w{4,})s$/, '$1')) || hay.includes(SEARCH_SYN[w] || '\u0000'));
    }

    function getFilteredAndSortedProducts(applyStoreFilter = false) {
      const catalog = getAllCatalog().filter(matchesProvince);
      const q = (state.search || '').trim().toLowerCase();
      let list = catalog.filter(p => {
        if (state.onlyFavs && !(state.favorites || []).includes(p.id)) return false;
        if (state.category !== 'All' && p.category !== state.category) return false;
        if (state.dealTypeFilter !== 'All' && p.dealType !== state.dealTypeFilter) return false;
        if (state.pamphletFilter !== 'All' && p.pamphletTitle !== state.pamphletFilter) return false;
        if (applyStoreFilter && state.storeFilter !== 'All' && !p.stores.some(st => st.store === state.storeFilter)) return false;
        if (q && !matchesSearch(p, q)) return false;
        return true;
      });
      if (state.sortBy === 'savings') {
        list.sort((a, b) => getMaxSpread(b) - getMaxSpread(a));
      } else if (state.sortBy === 'cheapest') {
        list.sort((a, b) => effectivePrice(getCheapestOption(a)) - effectivePrice(getCheapestOption(b)));
      } else if (state.sortBy === 'highest') {
        list.sort((a, b) => effectivePrice(getCheapestOption(b)) - effectivePrice(getCheapestOption(a)));
      } else if (state.sortBy === 'drops') {
        const dr = p => p.prevBestPrice ? p.prevBestPrice - effectivePrice(getCheapestOption(p)) : -1;
        list.sort((a, b) => dr(b) - dr(a));
      } else if (state.sortBy === 'unit') {
        const u = p => p.sizeAmount ? effectivePrice(getCheapestOption(p)) / p.sizeAmount : Infinity;
        list.sort((a, b) => u(a) - u(b));
      } else if (state.sortBy === 'ending') {
        list.sort((a, b) => String(a.validUntil || '9999').localeCompare(String(b.validUntil || '9999')));
      } else if (state.sortBy === 'stores') {
        list.sort((a, b) => b.stores.length - a.stores.length);
      }
      return { catalog, list };
    }

    // =========================================================================
    // VIEW 3: MY BASKET — 1-SHOP VS SPLIT-SHOP RUSH-HOUR COMPARATOR + LIVE PRICE EDIT
    // =========================================================================
    function computeSingleStoreTotals() {
      const catalog = getAllCatalog();
      const majorStores = ['Boxer', 'Shoprite', 'Pick n Pay', 'Checkers', 'SPAR'];
      const results = [];
      majorStores.forEach(stName => {
        let total = 0;
        let matched = 0;
        state.basket.forEach(it => {
          const prod = catalog.find(p => p.id === it.productId);
          const opt = prod && prod.stores.find(s => s.store === stName);
          if (opt) {
            total += effectivePrice(opt) * it.qty;
            matched++;
          } else {
            const unit = (it.card && state.activeCards[it.card]) ? it.rewardPrice : it.price;
            total += unit * it.qty;
          }
        });
        if (matched > 0) results.push({ store: stName, total, matched, ofTotal: state.basket.length });
      });
      return results.sort((a, b) => a.total - b.total);
    }

    // =========================================================================
    // VIEW 5: VOICE HELPER
    // =========================================================================
    let isListening = false;
    function runSmartQuery(rawQuery) {
      const q = (rawQuery || '').trim().toLowerCase();
      if (!q) return;
      const available = getAllCatalog().filter(matchesProvince);
      const budgetMatch = q.match(/r?\s*(\d{2,5})/);
      if (q.includes('build') || q.includes('plan') || (q.includes('basket') && budgetMatch)) {
        const cap = budgetMatch ? Number(budgetMatch[1]) : (state.budgetLimit || 900);
        state.budgetLimit = cap;
        const pool = available.filter(p => q.includes('gadget') || q.includes('appliance') ? p.category === 'Gadgets & Appliances' : q.includes('meat') ? p.category === 'Meat, Poultry & Deli' : p.category !== 'Gadgets & Appliances' && p.category !== 'Clothing & Footwear');
        state.basket = [];
        let spent = 0;
        const byCat = {};
        pool.slice().sort((x, y) => effectivePrice(getCheapestOption(x)) - effectivePrice(getCheapestOption(y))).forEach(p => (byCat[p.category] = byCat[p.category] || []).push(p));
        const mixed = [];
        for (let r = 0; Object.values(byCat).some(l => l[r]); r++) Object.values(byCat).forEach(l => { if (l[r]) mixed.push(l[r]); });
        mixed.forEach(p => {
          const best = getCheapestOption(p);
          const cost = effectivePrice(best);
          if (spent + cost <= cap) {
            state.basket.push({ id: 'b_' + p.id + Date.now(), productId: p.id, name: p.name, store: best.store, price: best.price, rewardPrice: best.rewardPrice, card: best.card, qty: 1, checked: false });
            spent += cost;
          }
        });
        state.assistantReply = `Built a ${zar(spent)} basket (${state.basket.length} items) inside your ${zar(cap)} budget. Tap "My Basket" to review!`;
        saveState(); updateHeader(); speakBack(state.assistantReply); renderAssistant(); lucide.createIcons();
        return;
      }
      const matched = available.filter(p => matchesSearch(p, q)).sort((x, y) => effectivePrice(getCheapestOption(x)) - effectivePrice(getCheapestOption(y)));
      if (matched.length) {
        if (q.includes('add')) {
          matched.slice(0, 2).forEach(p => addToBasket(p, getCheapestOption(p)));
          state.assistantReply = `Added ${matched.slice(0, 2).map(p => `${p.name} (${getCheapestOption(p).store} ${zar(effectivePrice(getCheapestOption(p)))})`).join(' and ')}!`;
        } else {
          state.assistantReply = matched.slice(0, 6).map(p => {
            const best = getCheapestOption(p);
            return `• ${p.name}: Cheapest at ${best.store} for ${zar(effectivePrice(best))}`;
          }).join('\n');
        }
        saveState(); updateHeader(); speakBack(state.assistantReply); renderAssistant(); lucide.createIcons();
        return;
      }
      state.assistantReply = `No exact match for "${rawQuery}". Try "Air fryer", "Russians", "Pies", "Build a R900 basket", or "Add maize".`;
      renderAssistant(); lucide.createIcons();
    }

    // --- Offer start/expiry clock ---
    let offerBoundaryTimer = null;
    function scheduleOfferBoundaryRefresh() {
      if (offerBoundaryTimer) clearTimeout(offerBoundaryTimer);
      const now = Date.now();
      let nextBoundary = Infinity;
      const catalogue = [...(state.customCatalog || []), ...(REMOTE_CATALOG || [])];
      const consider = value => {
        if (!value) return;
        const ms = new Date(value).getTime();
        if (Number.isFinite(ms) && ms > now && ms < nextBoundary) nextBoundary = ms;
      };
      const dateBoundary = value => {
        if (!value || !/^\d{4}-\d{2}-\d{2}/.test(String(value))) return;
        const ms = sastCalendarBoundary(String(value).slice(0, 10));
        if (ms > now && ms < nextBoundary) nextBoundary = ms;
      };
      catalogue.forEach(product => (product.stores || []).forEach(storeOffer => {
        const candidates = [storeOffer, ...(Array.isArray(storeOffer.moreOffers) ? storeOffer.moreOffers : [])];
        candidates.forEach(offer => {
          const validFromAt = offer.validFromAt || (!offer.validFrom ? (storeOffer.validFromAt || product.validFromAt) : '');
          const validUntilAt = offer.validUntilAt || (!offer.validUntil ? (storeOffer.validUntilAt || product.validUntilAt) : '');
          const validFrom = offer.validFrom || (!offer.validFromAt ? (storeOffer.validFrom || product.validFrom) : '');
          const validUntil = offer.validUntil || (!offer.validUntilAt ? (storeOffer.validUntil || product.validUntil) : '');
          consider(validFromAt);
          consider(validUntilAt);
          if (!validFromAt) dateBoundary(validFrom);
          if (!validUntilAt && validUntil && /^\d{4}-\d{2}-\d{2}/.test(String(validUntil))) {
            const ms = sastCalendarBoundary(String(validUntil).slice(0, 10), 1);
            if (ms > now && ms < nextBoundary) nextBoundary = ms;
          }
        });
      }));
      if (!Number.isFinite(nextBoundary)) return;
      const delay = Math.max(250, Math.min(2147480000, nextBoundary - now + 100));
      offerBoundaryTimer = setTimeout(() => {
        window._decoKey = null;
        renderCurrentTab();
      }, delay);
    }

        state.lang = e.target.value; saveState(); renderCurrentTab();
        showToast('Language updated');
      });
    }
    document.getElementById('province-select').addEventListener('change', e => {
      state.province = e.target.value;
      saveState();
      renderFooter();
      renderCurrentTab();
      showToast(`Location set to ${state.province} — regional deals & store maps updated!`);
    });

    // Auto-refresh every 15 minutes when online & visible + instant sync on internet reconnect
    window.addEventListener('online', () => {
      showToast('Back online — syncing latest pamphlet deals...');
      fetchLiveDeals(false);
    });
    window.addEventListener('offline', () => { renderCurrentTab(); });
    setInterval(() => {
      if (state.autoSync && navigator.onLine && document.visibilityState === 'visible') {
        fetchLiveDeals(false);
      }
    }, 15 * 60 * 1000);

    // Capture Chrome Android's native Install prompt for 1-tap in-app installation
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('install-pwa-btn');
      if (btn) btn.classList.remove('hidden');
    });
    const installBtn = document.getElementById('install-pwa-btn');
    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        if (choice && choice.outcome === 'accepted') {
          showToast('Installing Mzansi Smart Basket to your home screen!');
          installBtn.classList.add('hidden');
        }
        deferredInstallPrompt = null;
      });
    }
    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('install-pwa-btn');
      if (btn) btn.classList.add('hidden');
      showToast('Mzansi Smart Basket installed!');
    });

    // Register PWA Service Worker
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:' && !(window.MzansiNative && window.MzansiNative.isNative)) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }

    document.addEventListener('click', e => { if (e.target.closest && e.target.closest('[data-show-all]')) { state.visibleLimit = 1e9; renderCurrentTab(); } });
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { io.unobserve(en.target); en.target.click(); } }), { rootMargin: '1500px' });
      new MutationObserver(() => document.querySelectorAll('#load-more-btn, #sp-load-more-btn').forEach(b => io.observe(b))).observe(document.getElementById('app-main'), { childList: true });
    }

    loadCachedFeed();
    updateHeader();
    renderFooter();
    switchTab('quickpick');
    fetchLiveDeals(false);
  </script>

<!-- Personal Edition: Quick In-Store Price Logger (stored 100% locally in localStorage) -->
<div id="msb-personal-bar" style="position:fixed;right:14px;bottom:78px;z-index:60;">
  <button id="msb-add-price-btn" type="button" aria-label="Log a personal shelf price" style="background:#0f766e;color:#fff;border:none;border-radius:999px;padding:10px 14px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(15,23,42,.25);cursor:pointer;">+ My Price</button>
</div>
<div id="msb-personal-modal" role="dialog" aria-modal="true" aria-labelledby="msb-personal-title" style="display:none;position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.6);align-items:center;justify-content:center;padding:16px;">
  <div style="background:#fff;color:#0f172a;max-width:420px;width:100%;border-radius:16px;padding:18px;box-shadow:0 20px 40px rgba(0,0,0,.3);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h2 id="msb-personal-title" style="margin:0;font-size:16px;font-weight:800;">Log Personal Shelf Price</h2>
      <button id="msb-personal-close" type="button" aria-label="Close" style="background:#f1f5f9;border:none;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer;">✕</button>
    </div>
    <p style="font-size:12px;color:#475569;margin:0 0 10px;">Saved only on your phone (offline). Merged straight into your basket comparison.</p>
    <form id="msb-personal-form" style="display:grid;gap:8px;font-size:13px;">
      <label>Store<select id="msb-p-store" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-top:2px;">
        <option>Checkers</option><option>Shoprite</option><option>Pick n Pay</option><option>Woolworths</option><option>Boxer</option><option>SPAR</option><option>Makro</option><option>Game</option><option>Usave</option><option>Other</option>
      </select></label>
      <label>Item Name &amp; Size<input id="msb-p-name" type="text" required placeholder="e.g. Clover Full Cream Milk 2L" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-top:2px;" /></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <label>Normal Price (R)<input id="msb-p-price" type="number" step="0.01" min="0.01" inputmode="decimal" required placeholder="36.99" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-top:2px;" /></label>
        <label>Special / Card (R)<input id="msb-p-reward" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="32.99" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-top:2px;" /></label>
      </div>
      <label>Valid Until<input id="msb-p-until" type="date" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-top:2px;" /></label>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button type="submit" style="flex:1;background:#0f766e;color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;cursor:pointer;">Save to My Basket</button>
        <button id="msb-p-clear" type="button" style="background:#fee2e2;color:#991b1b;border:none;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;">Clear Mine</button>
      </div>
    </form>
  </div>
</div>
<script>
(function(){
  const KEY = 'msb_personal_deals_v1';
  const loadMine = () => { try { const a = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(a) ? a : []; } catch { return []; } };
  const saveMine = (arr) => { try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch {} };
  const mergeMineIntoApp = () => {
    const mine = loadMine();
    if (!mine.length || typeof window.PRODUCTS === 'undefined' || !Array.isArray(window.PRODUCTS)) return;
    const ids = new Set(window.PRODUCTS.map(p => p.id));
    mine.forEach(item => { if (!ids.has(item.id)) window.PRODUCTS.unshift(item); });
  };
  const modal = document.getElementById('msb-personal-modal');
  const openBtn = document.getElementById('msb-add-price-btn');
  const closeBtn = document.getElementById('msb-personal-close');
  const form = document.getElementById('msb-personal-form');
  const clearBtn = document.getElementById('msb-p-clear');
  if (openBtn && modal) openBtn.addEventListener('click', () => { modal.style.display = 'flex'; });
  if (closeBtn && modal) closeBtn.addEventListener('click', () => { modal.style.display = 'none'; });
  if (clearBtn) clearBtn.addEventListener('click', () => { saveMine([]); location.reload(); });
  if (form) form.addEventListener('submit', (e) => {
    e.preventDefault();
    const store = document.getElementById('msb-p-store').value;
    const name = document.getElementById('msb-p-name').value.trim();
    const price = parseFloat(document.getElementById('msb-p-price').value);
    const reward = parseFloat(document.getElementById('msb-p-reward').value) || price;
    const until = document.getElementById('msb-p-until').value || '2099-12-31';
    if (!name || !Number.isFinite(price)) return;
    const mine = loadMine();
    const id = 'personal_' + Date.now();
    mine.unshift({ id, name, category: 'Personal', provinces: ['All'], stores: [{ store, price, rewardPrice: Math.min(price, reward), validUntil: until, pamphletTitle: 'My Personal Price' }] });
    saveMine(mine);
    modal.style.display = 'none';
    location.reload();
  });
  window.addEventListener('load', () => setTimeout(mergeMineIntoApp, 400));
})();
</script>
