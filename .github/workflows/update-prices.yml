name: Update SA Pamphlet Prices

on:
  schedule:
    # Runs every Monday and Wednesday at 03:00 UTC (05:00 SAST)
    - cron: '0 3 * * 1,3'
  push:
    paths:
      - 'pamphlets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-specials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract pamphlet prices with Gemini Vision
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/extract_pamphlets.py

      - name: Commit updated deals.json
        run: |
          git config user.name "Mzansi Basket Bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals.json
          git diff --staged --quiet || git commit -m "chore: update weekly SA specials feed"
          git push
