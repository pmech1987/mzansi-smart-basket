    const defaultState = {
      activeTab: 'specials',
      province: 'Gauteng',
      category: 'All',
      storeFilter: 'All',
      search: '',
      budgetLimit: 1200,
      feedUrl: './deals.json',
      showFeedPanel: false,
      activeCards: { xtra: true, smart: true, boxer: true, spar: false },
      cardNumbers: { xtra: '', smart: '', boxer: '', spar: '' },
      basket: [
        { id: 'b1', productId: 'p1', name: '10kg White Maize Meal', store: 'Boxer', price: 109.99, rewardPrice: 104.99, card: 'boxer', qty: 1, checked: false },
        { id: 'b2', productId: 'p2', name: '2L Sunflower Cooking Oil', store: 'Shoprite', price: 69.99, rewardPrice: 64.99, card: 'xtra', qty: 1, checked: false },
        { id: 'b3', productId: 'p5', name: '5kg IQF Mixed Chicken Portions', store: 'Boxer', price: 199.99, rewardPrice: 189.99, card: 'boxer', qty: 1, checked: false }
      ],
      assistantReply: 'Try saying or typing: "Build a R700 staple basket", "Cheapest chicken", "Snacks under R100", or "Add rice".'
    };

    let state = { ...defaultState };
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state = { ...defaultState, ...JSON.parse(saved) };
    } catch (e) {}

    // Active catalog & live feed metadata
    let CATALOG = SAMPLE_CATALOG.slice();
    let feedMeta = {
      status: 'sample', // 'live' | 'cached' | 'local' | 'sample' | 'loading'
      updatedAt: null,
      sourceNote: 'Built-in editable sample deals'
    };

    function loadCachedFeed() {
      try {
        const raw = localStorage.getItem(FEED_CACHE_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.products) && parsed.products.length > 0) {
          CATALOG = parsed.products;
          feedMeta = {
            status: parsed.imported ? 'local' : 'cached',
            updatedAt: parsed.updatedAt || null,
            sourceNote: parsed.sourceNote || 'Offline cached deals'
          };
          return true;
        }
      } catch (e) {}
      return false;
    }

    function normalizeFeedPayload(data) {
      const list = Array.isArray(data) ? data : (Array.isArray(data && data.products) ? data.products : null);
      if (!list || !list.length) return null;
      const cleaned = list
        .filter(item => item && item.name && Array.isArray(item.stores) && item.stores.length > 0)
        .map((item, idx) => ({
          id: item.id || ('live_' + idx),
          name: String(item.name),
          category: String(item.category || 'Staples'),
          emoji: String(item.emoji || '🛒'),
          provinces: Array.isArray(item.provinces) && item.provinces.length ? item.provinces : ['All'],
          validUntil: item.validUntil ? String(item.validUntil) : '',
          stores: item.stores.map(st => ({
            store: String(st.store || 'Store'),
            price: Number(st.price) || 0,
            rewardPrice: Number(st.rewardPrice != null ? st.rewardPrice : st.price) || 0,
            card: st.card || null
          })).filter(st => st.price > 0)
        }))
        .filter(item => item.stores.length > 0);
      if (!cleaned.length) return null;
      return {
        updatedAt: (data && data.updatedAt) ? String(data.updatedAt) : new Date().toISOString(),
        sourceNote: (data && data.sourceNote) ? String(data.sourceNote) : 'Live weekly pamphlet feed',
        products: cleaned
      };
    }

    function formatUpdatedAt(isoStr) {
      if (!isoStr) return 'Not synced yet';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return String(isoStr);
        return d.toLocaleString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return String(isoStr);
      }
    }

    async function fetchLiveDeals(userInitiated = false) {
      const url = (state.feedUrl || '').trim();
      if (!url) return;
      // Avoid noisy console errors when opened directly via file:// with relative ./deals.json
      if (window.location.protocol === 'file:' && url.startsWith('.')) {
        if (userInitiated) showToast('Host on GitHub Pages/Netlify or use "Load Local JSON" below.');
        return;
      }
      if (userInitiated) {
        feedMeta.status = 'loading';
        if (state.activeTab === 'specials') { renderSpecials(); lucide.createIcons(); }
      }
      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(url + sep + 't=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const raw = await res.json();
        const normalized = normalizeFeedPayload(raw);
        if (!normalized) throw new Error('Invalid deals.json format');

        CATALOG = normalized.products;
        feedMeta = {
          status: 'live',
          updatedAt: normalized.updatedAt,
          sourceNote: normalized.sourceNote
        };
        try {
          localStorage.setItem(FEED_CACHE_KEY, JSON.stringify({ ...normalized, imported: false }));
        } catch (e) {}

        if (state.activeTab === 'specials') { renderSpecials(); lucide.createIcons(); }
        if (userInitiated) showToast(`Synced ${CATALOG.length} live specials!`);
      } catch (err) {
        const hadCache = loadCachedFeed();
        if (!hadCache) {
          CATALOG = SAMPLE_CATALOG.slice();
          feedMeta = { status: 'sample', updatedAt: null, sourceNote: 'Built-in editable sample deals' };
        }
        if (state.activeTab === 'specials') { renderSpecials(); lucide.createIcons(); }
        if (userInitiated) {
          showToast(hadCache ? 'Offline — showing cached specials.' : 'Feed unreachable — showing built-in sample deals.');
        }
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(window._mt);
      window._mt = setTimeout(() => t.classList.add('hidden'), 2600);
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function zar(n) {
      return 'R ' + (Number(n) || 0).toFixed(2);
    }

    function effectivePrice(storeOpt) {
      if (storeOpt.card && state.activeCards[storeOpt.card]) {
        return storeOpt.rewardPrice;
      }
      return storeOpt.price;
    }

    function getCheapestOption(product) {
      return product.stores.slice().sort((a, b) => effectivePrice(a) - effectivePrice(b))[0];
    }

    function matchesProvince(product) {
      if (!Array.isArray(product.provinces) || !product.provinces.length) return true;
      return product.provinces.includes('All') || product.provinces.includes(state.province);
    }

    function computeBasket() {
      let regularTotal = 0;
      let finalTotal = 0;
      state.basket.forEach(item => {
        const qty = Number(item.qty) || 1;
        regularTotal += (Number(item.price) || 0) * qty;
        const unit = (item.card && state.activeCards[item.card]) ? (Number(item.rewardPrice) || Number(item.price)) : (Number(item.price) || 0);
        finalTotal += unit * qty;
      });
      const rewardsSaved = Math.max(0, regularTotal - finalTotal);
      const remaining = (Number(state.budgetLimit) || 0) - finalTotal;
      return { regularTotal, finalTotal, rewardsSaved, remaining };
    }

    function updateHeader() {
      const b = computeBasket();
      document.getElementById('hdr-basket-total').textContent = zar(b.finalTotal);
      document.getElementById('province-select').value = state.province;
    }

    function addToBasket(product, storeOpt) {
      const existing = state.basket.find(x => x.productId === product.id && x.store === storeOpt.store);
      if (existing) {
        existing.qty++;
      } else {
        state.basket.push({
          id: 'b_' + Date.now() + Math.random().toString(16).slice(2, 5),
          productId: product.id,
          name: product.name,
          store: storeOpt.store,
          price: storeOpt.price,
          rewardPrice: storeOpt.rewardPrice,
          card: storeOpt.card,
          qty: 1,
          checked: false

      }));
      document.querySelectorAll('[data-inc]').forEach(btn => btn.addEventListener('click', () => {
        const it = state.basket.find(x => x.id === btn.dataset.inc);
        if (it) { it.qty++; saveState(); updateHeader(); renderBasket(); }
      }));
      document.querySelectorAll('[data-dec]').forEach(btn => btn.addEventListener('click', () => {
        const it = state.basket.find(x => x.id === btn.dataset.dec);
        if (it && it.qty > 1) { it.qty--; saveState(); updateHeader(); renderBasket(); }
      }));
      document.querySelectorAll('[data-rem]').forEach(btn => btn.addEventListener('click', () => {
        state.basket = state.basket.filter(x => x.id !== btn.dataset.rem);
        saveState(); updateHeader(); renderBasket();
      }));
    }

    // =========================================================================
    // VIEW 3: REWARDS CARDS WALLET
    // =========================================================================
    function renderRewards() {
      const b = computeBasket();
      document.getElementById('app-main').innerHTML = `
        <div class="space-y-5 animate-fade max-w-4xl mx-auto">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">SA Rewards Cards Wallet</h1>
              <p class="text-sm text-slate-500">Toggle the cards you own—member discounts apply automatically across all specials and your basket.</p>
            </div>
            <div class="px-4 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-extrabold">
              Current Basket Savings: ${zar(b.rewardsSaved)}
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${REWARD_CARDS.map(rc => {
              const on = !!state.activeCards[rc.id];
              return `
                <div class="rounded-2xl p-5 bg-gradient-to-br ${rc.color} text-white shadow-md flex flex-col justify-between gap-4 ${on ? '' : 'opacity-65'}">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <div class="text-[11px] uppercase tracking-wider text-white/80 font-bold">Loyalty Card</div>
                      <h3 class="font-extrabold text-lg mt-0.5">${rc.name}</h3>
                    </div>
                    <button data-toggle-card="${rc.id}" class="px-3 py-1.5 rounded-full text-xs font-extrabold ${on ? 'bg-white text-slate-900' : 'bg-black/30 text-white border border-white/30'}">
                      ${on ? '✓ Active' : 'Turn On'}
                    </button>
                  </div>
                  <p class="text-xs text-white/90 leading-relaxed">${rc.desc}</p>
                  <div>
                    <label class="block text-[11px] text-white/80 font-semibold mb-1">Optional Card Number (stored only on your phone)</label>
                    <input data-card-num="${rc.id}" type="text" value="${escapeHtml(state.cardNumbers[rc.id] || '')}" placeholder="e.g. 6001 2345 6789" class="w-full px-3 py-2 rounded-xl bg-black/25 border border-white/25 text-white placeholder-white/50 text-xs font-mono" />
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      document.querySelectorAll('[data-toggle-card]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.toggleCard;
          state.activeCards[id] = !state.activeCards[id];
          saveState(); updateHeader(); renderRewards();
          showToast(state.activeCards[id] ? 'Rewards card activated — prices updated!' : 'Rewards card turned off');
        });
      });
      document.querySelectorAll('[data-card-num]').forEach(inp => {
        inp.addEventListener('change', e => {
          state.cardNumbers[e.target.dataset.cardNum] = e.target.value.trim();
          saveState(); showToast('Card number saved privately on phone');
        });
      });
    }

    // =========================================================================
    // VIEW 4: VOICE TALK & SMART BUDGET HELPER
    // =========================================================================
    let isListening = false;
    function runSmartQuery(rawQuery) {
      const q = (rawQuery || '').trim().toLowerCase();
      if (!q) return;

      const available = CATALOG.filter(matchesProvince);
      const budgetMatch = q.match(/r?\s*(\d{2,5})/);
      if (q.includes('build') || q.includes('plan') || (q.includes('basket') && budgetMatch)) {
        const cap = budgetMatch ? Number(budgetMatch[1]) : state.budgetLimit;
        state.budgetLimit = cap;
        const pool = available.filter(p => q.includes('snack') ? p.category === 'Snacks & Drinks' : q.includes('cloth') ? p.category === 'Clothing' : p.category !== 'Clothing');
        state.basket = [];
        let spent = 0;
        pool.forEach(p => {
          const best = getCheapestOption(p);
          const cost = effectivePrice(best);
          if (spent + cost <= cap) {
            state.basket.push({ id: 'b_' + p.id + Date.now(), productId: p.id, name: p.name, store: best.store, price: best.price, rewardPrice: best.rewardPrice, card: best.card, qty: 1, checked: false });
            spent += cost;
          }
        });
        state.assistantReply = `Done! I built a smart ${zar(spent)} basket (${state.basket.length} cheapest items) inside your ${zar(cap)} budget using your active Rewards Cards. Open "My Basket & Budget" to check it off!`;
        saveState(); updateHeader(); speakBack(state.assistantReply); renderAssistant(); lucide.createIcons();
        return;
      }

      const matched = available.filter(p => q.split(/\s+/).some(w => w.length >= 3 && (p.name.toLowerCase().includes(w) || p.category.toLowerCase().includes(w))));
      if (matched.length) {
        if (q.includes('add')) {
          matched.slice(0, 2).forEach(p => addToBasket(p, getCheapestOption(p)));
          state.assistantReply = `Added ${matched.slice(0, 2).map(p => `${p.name} (${getCheapestOption(p).store} ${zar(effectivePrice(getCheapestOption(p)))})`).join(' and ')} to your basket!`;
        } else {
          state.assistantReply = matched.slice(0, 4).map(p => {
            const best = getCheapestOption(p);
            return `• ${p.name}: Cheapest at ${best.store} for ${zar(effectivePrice(best))}`;
          }).join('\n');
        }
        saveState(); updateHeader(); speakBack(state.assistantReply); renderAssistant(); lucide.createIcons();
        return;
      }

      state.assistantReply = `I searched for "${rawQuery}". Try saying "Build a R600 staple basket", "Add chicken", "Cheapest oil", or "Snacks".`;
      renderAssistant(); lucide.createIcons();
    }

    function speakBack(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text.replace(/•/g, ''));
          u.rate = 1.0;
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
    }

    function renderAssistant() {
      const hasVoice = ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
      document.getElementById('app-main').innerHTML = `
        <div class="space-y-5 animate-fade max-w-3xl mx-auto">
          <div class="text-center">
            <h1 class="text-2xl font-extrabold text-slate-900">🎙️ Voice Talk &amp; Smart Budget Helper</h1>
            <p class="text-sm text-slate-500 mt-1">Speak hands-free while checking your kitchen cupboards, or tap a quick prompt below.</p>
          </div>

          <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm text-center space-y-5">
            <button id="voice-mic-btn" class="w-20 h-20 mx-auto rounded-full ${isListening ? 'bg-rose-600 mic-live' : 'bg-orange-600 hover:bg-orange-700'} text-white flex items-center justify-center shadow-lg transition">
              <i data-lucide="mic" class="w-9 h-9"></i>
            </button>
            <div class="text-xs font-bold ${isListening ? 'text-rose-600' : 'text-slate-500'}">
              ${isListening ? 'Listening... speak now!' : hasVoice ? 'Tap the mic and speak (e.g. "Build a R600 staple basket")' : 'Type your request below (voice mic works best in Chrome on Android)'}
            </div>

            <form id="smart-query-form" class="flex gap-2">
              <input id="smart-query-input" type="text" placeholder="Ask: Build a R800 staple basket, Cheapest rice, Add milk..." class="flex-1 px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
              <button type="submit" class="px-5 py-3 rounded-xl bg-slate-900 text-white font-bold text-sm hover:bg-slate-800">Ask</button>
            </form>

            <div class="flex flex-wrap justify-center gap-2">
              <button data-qprompt="Build a R650 staple basket" class="px-3 py-1.5 rounded-full bg-orange-50 text-orange-800 border border-orange-200 text-xs font-bold hover:bg-orange-100">Build a R650 staple basket</button>
              <button data-qprompt="Cheapest chicken" class="px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold hover:bg-emerald-100">Cheapest chicken</button>
              <button data-qprompt="Add maize meal" class="px-3 py-1.5 rounded-full bg-indigo-50 text-indigo-800 border border-indigo-200 text-xs font-bold hover:bg-indigo-100">Add maize meal</button>
              <button data-qprompt="Kids clothing deals" class="px-3 py-1.5 rounded-full bg-rose-50 text-rose-800 border border-rose-200 text-xs font-bold hover:bg-rose-100">Kids clothing deals</button>
            </div>

            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-left text-sm text-slate-800 whitespace-pre-line leading-relaxed">
              <div class="text-[11px] font-bold uppercase text-orange-600 mb-1">Smart Basket Reply</div>
              ${escapeHtml(state.assistantReply)}
            </div>
          </div>
        </div>
      `;

      document.getElementById('smart-query-form').addEventListener('submit', e => {
        e.preventDefault();
        runSmartQuery(document.getElementById('smart-query-input').value);
      });
      document.querySelectorAll('[data-qprompt]').forEach(b => b.addEventListener('click', () => runSmartQuery(b.dataset.qprompt)));
      document.getElementById('voice-mic-btn').addEventListener('click', () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { showToast('Voice mic requires Chrome on Android/Desktop — type below instead!'); return; }
        try {
          const rec = new SR();
          rec.lang = 'en-ZA';
          rec.interimResults = false;
          isListening = true;
          renderAssistant(); lucide.createIcons();
          rec.onresult = (ev) => {
            isListening = false;
            const spoken = ev.results[0][0].transcript;
            showToast('Heard: ' + spoken);
            runSmartQuery(spoken);
          };
          rec.onerror = () => { isListening = false; renderAssistant(); lucide.createIcons(); showToast('Could not hear clearly — try again'); };
          rec.onend = () => { if (isListening) { isListening = false; renderAssistant(); lucide.createIcons(); } };
          rec.start();
        } catch (e) { isListening = false; showToast('Mic blocked by browser settings'); }
      });
    }

    // --- Navigation ---
    function switchTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.getElementById('mobile-nav').classList.add('hidden');
      if (tab === 'specials') renderSpecials();
      else if (tab === 'basket') renderBasket();
      else if (tab === 'rewards') renderRewards();
      else if (tab === 'assistant') renderAssistant();
      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
    document.getElementById('hdr-basket-btn').addEventListener('click', () => switchTab('basket'));
    document.getElementById('mobile-menu-btn').addEventListener('click', () => document.getElementById('mobile-nav').classList.toggle('hidden'));
    document.getElementById('province-select').addEventListener('change', e => {
      state.province = e.target.value;
      saveState();
      switchTab(state.activeTab);
      showToast(`Location set to ${state.province}`);
    });

    // Startup: load cached feed immediately, then try live deals.json in background
    loadCachedFeed();
    updateHeader();
    switchTab('specials');
    fetchLiveDeals(false);
  </script>
</body>
</html>
