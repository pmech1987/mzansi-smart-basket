      state.basket.forEach(item => {
        const qty = Number(item.qty) || 1;
        totalQty += qty;
        regularTotal += (Number(item.price) || 0) * qty;
        const unit = (item.card && state.activeCards[item.card]) ? (Number(item.rewardPrice) || Number(item.price)) : (Number(item.price) || 0);
        finalTotal += unit * qty;
      });
      const rewardsSaved = Math.max(0, regularTotal - finalTotal);
      const hasBudget = state.budgetLimit !== null && state.budgetLimit !== '' && Number(state.budgetLimit) > 0;
      const remaining = hasBudget ? (Number(state.budgetLimit) - finalTotal) : null;
      return { regularTotal, finalTotal, rewardsSaved, remaining, hasBudget, totalQty };
    }

      return state.basket.find(x => x.productId === productId && (!storeName || x.store === storeName));

    function addToBasket(product, storeOpt) {
      const existing = state.basket.find(x => x.productId === product.id && x.store === storeOpt.store);
      if (existing) {
        existing.qty++;
      } else {
        state.basket.push({
          id: 'b_' + Date.now() + Math.random().toString(16).slice(2, 5),
          productId: product.id,
          name: product.name,
          store: storeOpt.store,
          price: storeOpt.price,
          rewardPrice: storeOpt.rewardPrice,
          card: storeOpt.card,
          qty: 1,
          checked: false
        });
      }
      saveState();
      updateHeader();
      showToast(`Added ${product.name} (${storeOpt.store})`);

      const idx = state.basket.findIndex(x => x.productId === productId && (!storeName || x.store === storeName));

      if (state.basket[idx].qty > 1) state.basket[idx].qty--;

      saveState();
      updateHeader();
    }

    function getFilteredAndSortedProducts(applyStoreFilter = false) {
      const catalog = getAllCatalog().filter(matchesProvince);
      const q = (state.search || '').trim().toLowerCase();
      let list = catalog.filter(p => {
        if (state.onlyFavs && !(state.favorites || []).includes(p.id)) return false;
        if (state.category !== 'All' && p.category !== state.category) return false;
        if (state.dealTypeFilter !== 'All' && p.dealType !== state.dealTypeFilter) return false;
        if (applyStoreFilter && state.storeFilter !== 'All' && !p.stores.some(st => st.store === state.storeFilter)) return false;
        if (q && !p.name.toLowerCase().includes(q) && !p.category.toLowerCase().includes(q) && !(p.pamphletTitle || '').toLowerCase().includes(q)) return false;
        return true;
      });
      if (state.sortBy === 'savings') {
        list.sort((a, b) => getMaxSpread(b) - getMaxSpread(a));
      } else if (state.sortBy === 'cheapest') {
        list.sort((a, b) => effectivePrice(getCheapestOption(a)) - effectivePrice(getCheapestOption(b)));
      } else if (state.sortBy === 'highest') {
        list.sort((a, b) => effectivePrice(getCheapestOption(b)) - effectivePrice(getCheapestOption(a)));
      } else if (state.sortBy === 'stores') {
        list.sort((a, b) => b.stores.length - a.stores.length);
      }
      return { catalog, list };
    }

    // =========================================================================
    // VIEW 3: MY BASKET — 1-SHOP VS SPLIT-SHOP RUSH-HOUR COMPARATOR + LIVE PRICE EDIT
    // =========================================================================
    function computeSingleStoreTotals() {
      const catalog = getAllCatalog();
      const majorStores = ['Boxer', 'Shoprite', 'Pick n Pay', 'Checkers', 'SPAR'];
      const results = [];
      majorStores.forEach(stName => {
        let total = 0;
        let matched = 0;
        state.basket.forEach(it => {
          const prod = catalog.find(p => p.id === it.productId);
          const opt = prod && prod.stores.find(s => s.store === stName);
          if (opt) {
            total += effectivePrice(opt) * it.qty;
            matched++;
          } else {
            const unit = (it.card && state.activeCards[it.card]) ? it.rewardPrice : it.price;
            total += unit * it.qty;
          }
        });
        if (matched > 0) results.push({ store: stName, total, matched, ofTotal: state.basket.length });
      });
      return results.sort((a, b) => a.total - b.total);
    }

                <div class="divide-y divide-slate-100">
                  ${items.map(it => {

                    return `
                      <div class="px-4 py-3 flex items-center justify-between gap-2">
                        <label class="flex items-center gap-3 cursor-pointer flex-1 select-none min-w-0">
                          <input type="checkbox" data-chk-id="${it.id}" ${it.checked ? 'checked' : ''} class="w-4 h-4 rounded text-orange-600" />
                          <div class="min-w-0">
                            <div class="text-sm font-bold truncate ${it.checked ? 'line-through text-slate-400' : 'text-slate-900'}">${escapeHtml(it.name)}</div>
                            <div class="flex items-center gap-1 mt-0.5"><span class="text-[11px] text-slate-400">R</span><input type="number" step="0.01" min="0.50" data-edit-price="${it.id}" value="${Number(unit).toFixed(2)}" aria-label="Edit till price" class="w-16 px-1.5 py-0.5 rounded bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700" /><span class="text-[11px] text-slate-400">each</span></div>
                          </div>
                        </label>
                        <div class="flex items-center gap-1.5 shrink-0">
                          <button data-dec="${it.id}" class="w-7 h-7 rounded-lg bg-slate-100 font-bold text-slate-700">−</button>
                          <span class="text-xs font-extrabold w-5 text-center">${it.qty}</span>
                          <button data-inc="${it.id}" class="w-7 h-7 rounded-lg bg-slate-100 font-bold text-slate-700">+</button>
                          <span class="font-extrabold text-sm text-slate-900 w-18 text-right">${zar(unit * it.qty)}</span>
                          <button data-rem="${it.id}" class="text-slate-400 hover:text-rose-600 ml-1">✕</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('') : `
            <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 space-y-3">
              <div class="text-3xl">🛒</div>
              <div class="font-extrabold text-slate-900">Your basket is empty (R 0.00)</div>
              <p class="text-sm text-slate-500 max-w-md mx-auto">Open <strong>Quick Pick</strong> to choose items from any department (meat, staples, Russians, pies, gadgets, clothing).</p>
              <button id="empty-go-pick" class="px-5 py-2.5 rounded-xl bg-orange-600 text-white font-extrabold text-xs">Open Quick Pick →</button>
            </div>
          `}
        </div>
      `;

      const emptyBtn = document.getElementById('empty-go-pick');
      if (emptyBtn) emptyBtn.addEventListener('click', () => switchTab('quickpick'));
      document.getElementById('budget-limit-input').addEventListener('change', e => {
        const v = Number(e.target.value); state.budgetLimit = v > 0 ? v : null; saveState(); renderBasket();
      });
      const optBtn = document.getElementById('opt-basket-btn');
      if (optBtn) optBtn.addEventListener('click', () => {
        let switched = 0;
        const catalog = getAllCatalog();
        state.basket.forEach(item => {
          const prod = catalog.find(x => (item.productId && x.id === item.productId) || x.name.toLowerCase() === item.name.toLowerCase());
          if (!prod) return;
          const best = getCheapestOption(prod);
          if (best.store !== item.store || best.price !== item.price || best.rewardPrice !== item.rewardPrice) {
            item.store = best.store; item.price = best.price; item.rewardPrice = best.rewardPrice; item.card = best.card; switched++;
          }
        });
        saveState(); updateHeader(); renderBasket();
        showToast(switched > 0 ? `Switched ${switched} item(s) to cheaper stores!` : 'Already at the cheapest prices!');
      });
      const copyBtn = document.getElementById('copy-list-btn');
      if (copyBtn) copyBtn.addEventListener('click', () => {
        const lines = [`🛒 *Mzansi Smart Basket (${state.province})* — Total: ${zar(b.finalTotal)}`];
        Object.entries(byStore).forEach(([st, items]) => {
          lines.push(`\n🏪 *${st}:*`);
          items.forEach(it => {
            const unit = (it.card && state.activeCards[it.card]) ? it.rewardPrice : it.price;
            lines.push(`${it.checked ? '✅' : '⬜'} ${it.qty}x ${it.name} (${zar(unit * it.qty)})`);
          });
        });
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(lines.join('\n')).then(() => showToast('Copied for WhatsApp!'));
        }
      });
      const clearAll = document.getElementById('clear-all-btn');
      if (clearAll) clearAll.addEventListener('click', () => { state.basket = []; saveState(); updateHeader(); renderBasket(); showToast('Basket cleared'); });
      document.querySelectorAll('[data-edit-price]').forEach(inp => inp.addEventListener('change', e => {
        const it = state.basket.find(x => x.id === inp.dataset.editPrice);
        const num = Number(e.target.value);
        if (it && num > 0) {
          it.price = num; it.rewardPrice = num; saveState(); updateHeader(); renderBasket(); showToast('Till price updated!');
        }
      }));
      document.querySelectorAll('[data-chk-id]').forEach(c => c.addEventListener('change', e => {
        const it = state.basket.find(x => x.id === e.target.dataset.chkId);
        if (it) { it.checked = e.target.checked; saveState(); renderBasket(); }
      }));
      document.querySelectorAll('[data-inc]').forEach(btn => btn.addEventListener('click', () => {
        const it = state.basket.find(x => x.id === btn.dataset.inc);
        if (it) { it.qty++; saveState(); updateHeader(); renderBasket(); }
      }));
      document.querySelectorAll('[data-dec]').forEach(btn => btn.addEventListener('click', () => {
        const it = state.basket.find(x => x.id === btn.dataset.dec);
        if (it && it.qty > 1) { it.qty--; saveState(); updateHeader(); renderBasket(); }
      }));
      document.querySelectorAll('[data-rem]').forEach(btn => btn.addEventListener('click', () => {
        state.basket = state.basket.filter(x => x.id !== btn.dataset.rem); saveState(); updateHeader(); renderBasket();
      }));
    }

    // =========================================================================
    // VIEW 4: REWARDS CARDS
    // =========================================================================
    function renderRewards() {
      const b = computeBasket();
      document.getElementById('app-main').innerHTML = `
        <div class="space-y-5 animate-fade max-w-4xl mx-auto">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">SA Rewards Cards Wallet</h1>
              <p class="text-sm text-slate-500">Toggle your active cards—member discounts apply automatically across all departments.</p>
            </div>
            <div class="px-4 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-extrabold">
              Basket Savings: ${zar(b.rewardsSaved)}
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${REWARD_CARDS.map(rc => {
              const on = !!state.activeCards[rc.id];
              return `
                <div class="rounded-2xl p-5 bg-gradient-to-br ${rc.color} text-white shadow-md flex flex-col justify-between gap-4 ${on ? '' : 'opacity-65'}">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <div class="text-[11px] uppercase tracking-wider text-white/80 font-bold">Loyalty Card</div>
                      <h3 class="font-extrabold text-lg mt-0.5">${rc.name}</h3>
                    </div>
                    <button data-toggle-card="${rc.id}" class="px-3 py-1.5 rounded-full text-xs font-extrabold ${on ? 'bg-white text-slate-900' : 'bg-black/30 text-white border border-white/30'}">${on ? '✓ Active' : 'Turn On'}</button>
                  </div>
                  <p class="text-xs text-white/90">${rc.desc}</p>
                  <div>
                    <label class="block text-[11px] text-white/80 font-semibold mb-1">Optional Card Number (stored only on your phone)</label>
                    <input data-card-num="${rc.id}" type="text" value="${escapeHtml(state.cardNumbers[rc.id] || '')}" placeholder="e.g. 6001 2345 6789" class="w-full px-3 py-2 rounded-xl bg-black/25 border border-white/25 text-white placeholder-white/50 text-xs font-mono" />
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
      document.querySelectorAll('[data-toggle-card]').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.toggleCard; state.activeCards[id] = !state.activeCards[id];
        saveState(); updateHeader(); renderRewards();
      }));
      document.querySelectorAll('[data-card-num]').forEach(inp => inp.addEventListener('change', e => {
        state.cardNumbers[e.target.dataset.cardNum] = e.target.value.trim(); saveState(); showToast('Saved privately on phone');
      }));
    }

    // =========================================================================
    // VIEW 5: VOICE HELPER
    // =========================================================================
    let isListening = false;
    function runSmartQuery(rawQuery) {
      const q = (rawQuery || '').trim().toLowerCase();
      if (!q) return;
      const available = getAllCatalog().filter(matchesProvince);
      const budgetMatch = q.match(/r?\s*(\d{2,5})/);
      if (q.includes('build') || q.includes('plan') || (q.includes('basket') && budgetMatch)) {
        const cap = budgetMatch ? Number(budgetMatch[1]) : (state.budgetLimit || 900);
        state.budgetLimit = cap;
        const pool = available.filter(p => q.includes('gadget') || q.includes('appliance') ? p.category === 'Gadgets & Appliances' : q.includes('meat') ? p.category === 'Meat, Poultry & Deli' : p.category !== 'Gadgets & Appliances' && p.category !== 'Clothing & Footwear');
        state.basket = [];
        let spent = 0;
        pool.forEach(p => {
          const best = getCheapestOption(p);
          const cost = effectivePrice(best);
          if (spent + cost <= cap) {
            state.basket.push({ id: 'b_' + p.id + Date.now(), productId: p.id, name: p.name, store: best.store, price: best.price, rewardPrice: best.rewardPrice, card: best.card, qty: 1, checked: false });
            spent += cost;
          }
        });
        state.assistantReply = `Built a ${zar(spent)} basket (${state.basket.length} items) inside your ${zar(cap)} budget. Tap "My Basket" to review!`;
        saveState(); updateHeader(); speakBack(state.assistantReply); renderAssistant(); lucide.createIcons();
        return;
      }
      const matched = available.filter(p => q.split(/\s+/).some(w => w.length >= 3 && (p.name.toLowerCase().includes(w) || p.category.toLowerCase().includes(w))));
      if (matched.length) {
        if (q.includes('add')) {
          matched.slice(0, 2).forEach(p => addToBasket(p, getCheapestOption(p)));
          state.assistantReply = `Added ${matched.slice(0, 2).map(p => `${p.name} (${getCheapestOption(p).store} ${zar(effectivePrice(getCheapestOption(p)))})`).join(' and ')}!`;
        } else {
          state.assistantReply = matched.slice(0, 6).map(p => {
            const best = getCheapestOption(p);
            return `• ${p.name}: Cheapest at ${best.store} for ${zar(effectivePrice(best))}`;
          }).join('\n');
        }
        saveState(); updateHeader(); speakBack(state.assistantReply); renderAssistant(); lucide.createIcons();
        return;
      }
      state.assistantReply = `No exact match for "${rawQuery}". Try "Air fryer", "Russians", "Pies", "Build a R900 basket", or "Add maize".`;
      renderAssistant(); lucide.createIcons();
    }

    function speakBack(text) {
      try { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); window.speechSynthesis.speak(new SpeechSynthesisUtterance(text.replace(/•/g, ''))); } } catch (e) {}
    }

    function renderAssistant() {
      const hasVoice = ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
      document.getElementById('app-main').innerHTML = `
        <div class="space-y-5 animate-fade max-w-3xl mx-auto">
          <div class="text-center">
            <h1 class="text-2xl font-extrabold text-slate-900">🎙️ Voice Talk &amp; Smart Helper</h1>
            <p class="text-sm text-slate-500 mt-1">Ask for any item across all 12 departments—from Russians and pies to air fryers and TVs.</p>
          </div>
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm text-center space-y-5">
            <button id="voice-mic-btn" class="w-20 h-20 mx-auto rounded-full ${isListening ? 'bg-rose-600 mic-live' : 'bg-orange-600 hover:bg-orange-700'} text-white flex items-center justify-center shadow-lg transition">
              <i data-lucide="mic" class="w-9 h-9"></i>
            </button>
            <div class="text-xs font-bold ${isListening ? 'text-rose-600' : 'text-slate-500'}">${isListening ? 'Listening...' : hasVoice ? 'Tap the mic and speak' : 'Type below'}</div>
            <form id="smart-query-form" class="flex gap-2">
              <input id="smart-query-input" type="text" placeholder="Ask: Cheapest air fryer, Russians, Pies, Build R800 basket..." class="flex-1 px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" />
              <button type="submit" class="px-5 py-3 rounded-xl bg-slate-900 text-white font-bold text-sm">Ask</button>
            </form>
            <div class="flex flex-wrap justify-center gap-2">
              <button data-qprompt="Cheapest air fryer" class="px-3 py-1.5 rounded-full bg-orange-50 text-orange-800 border border-orange-200 text-xs font-bold">Cheapest air fryer</button>
              <button data-qprompt="Russians" class="px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold">Russians</button>
              <button data-qprompt="Pies" class="px-3 py-1.5 rounded-full bg-indigo-50 text-indigo-800 border border-indigo-200 text-xs font-bold">Pies</button>
              <button data-qprompt="Build a R900 basket" class="px-3 py-1.5 rounded-full bg-rose-50 text-rose-800 border border-rose-200 text-xs font-bold">Build a R900 basket</button>
            </div>
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-left text-sm text-slate-800 whitespace-pre-line">${escapeHtml(state.assistantReply)}</div>
          </div>
        </div>
      `;
      document.getElementById('smart-query-form').addEventListener('submit', e => { e.preventDefault(); runSmartQuery(document.getElementById('smart-query-input').value); });
      document.querySelectorAll('[data-qprompt]').forEach(b => b.addEventListener('click', () => runSmartQuery(b.dataset.qprompt)));
      document.getElementById('voice-mic-btn').addEventListener('click', () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { showToast('Type below — mic works in Chrome'); return; }
        try {
          const rec = new SR(); rec.lang = 'en-ZA'; isListening = true; renderAssistant(); lucide.createIcons();
          rec.onresult = ev => { isListening = false; runSmartQuery(ev.results[0][0].transcript); };
          rec.onerror = () => { isListening = false; renderAssistant(); lucide.createIcons(); };
          rec.onend = () => { if (isListening) { isListening = false; renderAssistant(); lucide.createIcons(); } };
          rec.start();
        } catch (e) { isListening = false; }
      });
    }

    // --- Navigation & Auto-Sync Engine ---
    function renderCurrentTab() {
      const tab = state.activeTab;
      if (tab === 'quickpick') renderQuickPick();
      else if (tab === 'specials') renderSpecials();
      else if (tab === 'basket') renderBasket();
      else if (tab === 'rewards') renderRewards();
      else if (tab === 'assistant') renderAssistant();
      lucide.createIcons();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('.bnav-btn').forEach(b => {
        const isAct = b.dataset.tab === tab;
        b.classList.toggle('text-orange-600', isAct);
        b.classList.toggle('bg-orange-50', isAct);
        b.classList.toggle('text-slate-600', !isAct);
      });
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
    document.getElementById('hdr-basket-btn').addEventListener('click', () => switchTab('basket'));
    document.getElementById('gps-btn').addEventListener('click', detectProvinceByGPS);
    document.getElementById('province-select').addEventListener('change', e => {
      state.province = e.target.value;
      saveState();
      renderFooter();
      renderCurrentTab();
      showToast(`Location set to ${state.province} — regional deals & store maps updated!`);
    });

    // Auto-refresh every 60s when online & visible + instant sync on internet reconnect
    window.addEventListener('online', () => {
      showToast('Back online — syncing latest pamphlet deals...');
      fetchLiveDeals(false);
    });
    window.addEventListener('offline', () => { renderCurrentTab(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.autoSync && navigator.onLine) {
        fetchLiveDeals(false);
      }
    });
    setInterval(() => {
      if (state.autoSync && navigator.onLine && document.visibilityState === 'visible') {
        fetchLiveDeals(false);
      }
    }, 60000);

    // Capture Chrome Android's native Install prompt for 1-tap in-app installation
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('install-pwa-btn');
      if (btn) btn.classList.remove('hidden');
    });
    const installBtn = document.getElementById('install-pwa-btn');
    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        if (choice && choice.outcome === 'accepted') {
          showToast('Installing Mzansi Smart Basket to your home screen!');
          installBtn.classList.add('hidden');
        }
        deferredInstallPrompt = null;
      });
    }
    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('install-pwa-btn');
      if (btn) btn.classList.add('hidden');
      showToast('Mzansi Smart Basket installed!');
    });

    // Register PWA Service Worker
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }

    loadCachedFeed();
    updateHeader();
    renderFooter();
    switchTab('quickpick');
    fetchLiveDeals(false);
  </script>
</body>
</html>
